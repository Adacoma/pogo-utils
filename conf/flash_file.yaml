---

# Read-only inventory of the archive exported by magnetometer_calibration.yaml.
# Pogosim requires the same category and robot ID set in both scenarios.
boundary_condition: solid
arena_file: arenas/square.csv
arena_surface: 1.0e6
enable_data_logging: false
enable_console_logging: true
console_filename: "frames/flash_file_console.txt"
simulation_time: 1.0
time_step: 0.01
seed: 0
GUI: true
initial_formation: power_lloyd

objects:
    robots:
        type: pogobot
        nb: 4
        geometry: disk
        radius: 26.5
        body_linear_damping: 0.3
        body_angular_damping: 0.3
        body_density: 10.0
        body_friction: 0.3
        body_restitution: 0.5
        max_linear_speed: 100.0
        max_angular_speed: 2.0
        communication_radius: 80.0
        msg_success_rate:
            type: static
            rate: 1.0
    walls:
        type: pogowall
        geometry: arena
        communication_radius: 100
        msg_success_rate:
            type: static
            rate: 1.0

parameters:
    todo: 0

flash_state:
    input_file: "magnetometer.pgflash"
