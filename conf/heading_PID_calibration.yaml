---

# Calibration/export partner for conf/heading_PID.yaml. It deliberately uses
# the same seed and 40 robot IDs as the later mission.
boundary_condition: periodic
arena_file: arenas/square.csv
arena_surface: 1.0e6
enable_data_logging: false
enable_console_logging: true
console_filename: "frames/heading_PID_calibration_console.txt"
simulation_time: 200.0
time_step: 0.01
seed: 0
GUI: true
initial_formation: power_lloyd

objects:
    robots:
        type: pogobot
        nb: 40
        geometry: disk
        radius: 26.5
        body_linear_damping: 0.3
        body_angular_damping: 0.3
        body_density: 10.0
        body_friction: 0.3
        body_restitution: 0.5
        max_linear_speed: 100.0
        max_angular_speed: 2.0
        linear_noise_stddev: 0
        angular_noise_stddev: 0.0
        #angular_systematic_bias_domain: [-200, 200]
        communication_radius: 80.0
        msg_success_rate:
            type: static
            rate: 1.0

parameters:
    todo: 0

flash_state:
    output_file: "heading_PID.pgflash"
